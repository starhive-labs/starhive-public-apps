<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Reporting</title>
    <!-- The Manrope font is injected by StarhiveAppProvider (@starhive/ui), so no <link> needed here. -->
    <style>
      /* Until Mantine's styles load, the document would paint its default white — a white
         flash inside a dark workspace. Transparent lets the host's own surface show through;
         Mantine's `body` rule loads later and wins, so this only covers the boot moment. */
      body { margin: 0; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
